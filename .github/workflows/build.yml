name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller \
            --name clipboard-tool \
            --console \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --hidden-import PyQt6.QtSql \
            --collect-all PyQt6 \
            --hidden-import=pynput.keyboard._xorg \
            --hidden-import=pynput.mouse._xorg \
            main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-tool-linux
          path: dist/clipboard-tool/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync
      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller \
            --name clipboard-tool \
            --console \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --hidden-import PyQt6.QtSql \
            --collect-all PyQt6 \
            --hidden-import=pynput.keyboard._win32 \
            --hidden-import=pynput.mouse._win32 \
            main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-tool-windows
          path: dist/clipboard-tool/

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # 1. 构建 arm64 版本
      - name: Build arm64
        run: |
          uv python install
          uv sync
          uv run pyinstaller \
            --name clipboard-tool \
            --console \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --hidden-import PyQt6.QtSql \
            --collect-all PyQt6 \
            --hidden-import=pynput.keyboard._darwin \
            --hidden-import=pynput.mouse._darwin \
            main.py
          mv dist/clipboard-tool dist/clipboard-tool-arm64

      # 2. 安装 Rosetta 2 和 x86_64 Python
      - name: Install Rosetta 2
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Setup x86_64 Python with conda
        run: |
          curl -fsSL -o miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-x86_64.sh
          bash miniforge.sh -b -p $HOME/miniconda-x86
          $HOME/miniconda-x86/bin/conda create -n x86_env python=3.12 pip -y
      - name: Build x86_64
        run: |
          X86_PYTHON="$HOME/miniconda-x86/envs/x86_env/bin/python"
          # 升级 pip 并安装构建依赖
          "$X86_PYTHON" -m pip install --upgrade pip setuptools wheel
          "$X86_PYTHON" -m pip install pyinstaller macholib pynput PyQt6
          # 验证 macholib 安装
          "$X86_PYTHON" -c "import macholib; print('macholib:', macholib.__file__)"
          # 构建
          "$X86_PYTHON" -m PyInstaller \
            --name clipboard-tool \
            --console \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --hidden-import PyQt6.QtSql \
            --collect-all PyQt6 \
            --hidden-import=pynput.keyboard._darwin \
            --hidden-import=pynput.mouse._darwin \
            main.py
          mv dist/clipboard-tool dist/clipboard-tool-x86_64

      # 3. 合并为 Universal Binary
      - name: Create Universal Binary
        run: |
          mkdir -p dist/clipboard-tool
          cp -R dist/clipboard-tool-arm64/* dist/clipboard-tool/
          
          # 合并主可执行文件
          lipo -create \
            dist/clipboard-tool-arm64/clipboard-tool \
            dist/clipboard-tool-x86_64/clipboard-tool \
            -output dist/clipboard-tool/clipboard-tool
          
          # 合并所有 Mach-O 动态库
          find dist/clipboard-tool-arm64 -type f | while read file; do
            rel_path="${file#$PWD/dist/clipboard-tool-arm64/}"
            x86_file="dist/clipboard-tool-x86_64/$rel_path"
            universal_file="dist/clipboard-tool/$rel_path"
            
            if [ -f "$x86_file" ] && file "$file" | grep -q "Mach-O"; then
              lipo -create "$file" "$x86_file" -output "$universal_file"
            fi
          done
          
          chmod +x dist/clipboard-tool/clipboard-tool
          rm -rf dist/clipboard-tool-arm64 dist/clipboard-tool-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-tool-macos
          path: dist/clipboard-tool/
