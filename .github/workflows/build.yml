name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: clipboard-tool-linux
            pyinstaller_args: "--hidden-import=pynput.keyboard._xorg --hidden-import=pynput.mouse._xorg"
          - os: macos-latest
            artifact_name: clipboard-tool-macos
            pyinstaller_args: "--hidden-import=pynput.keyboard._darwin --hidden-import=pynput.mouse._darwin"
          - os: windows-latest
            artifact_name: clipboard-tool-windows
            pyinstaller_args: "--hidden-import=pynput.keyboard._win32 --hidden-import=pynput.mouse._win32"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller (onedir mode)
        shell: bash
        run: |
          uv run pyinstaller \
            --name clipboard-tool \
            --console \
            --exclude-module matplotlib \
            --exclude-module numpy \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --hidden-import PyQt6.QtSql \
            --collect-all PyQt6 \
            ${{ matrix.pyinstaller_args }} \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/clipboard-tool/
